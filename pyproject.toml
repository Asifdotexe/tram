[project]
name = "tram"
version = "0.1.0"
description = "Terminal Router for Agent Modules - A zero-dependency file router for AI skills"
authors = [
    {name = "Asif Sayyed", email = "asifdotexe@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/Asifdotexe/tram"
Issues = "https://github.com/Asifdotexe/tram/issues"

[project.scripts]
tram = "tram.cli:main"

[dependency-groups]
dev = [
    "prek",
    "ruff>=0.9.0",
    "pytest>=8.4.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "B008",
]

[tool.pyright]
reportAny = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tram"]
